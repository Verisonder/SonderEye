name: Windows

# The Windows app (desktop/): a setup .exe and a portable zip.
# test/windows builds a pre-release named windows-test; a v* tag adds both files to that release.
on:
  push:
    branches:
      - 'test/windows'
    tags:
      - 'v*'
  # Builds from a branch and adds the Windows files to an existing release (named here).
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to add the Windows files to, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build the Windows app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache the bundled Blue Marble tiles
        uses: actions/cache@v4
        with:
          path: desktop/app/src/main/resources/bluemarble
          key: bluemarble-desktop-${{ hashFiles('tools/fetch_bluemarble.py') }}
      - name: Fetch the bundled Blue Marble tiles (NASA, public domain)
        shell: bash
        run: python tools/fetch_bluemarble.py desktop/app/src/main/resources/bluemarble 2>&1 | tail -n 5

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -p desktop :shared:test :app:packageExe :app:createDistributable 2>&1 | tee build.log

      - name: Package
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*val appVersion = "\(.*\)".*/\1/p' desktop/app/build.gradle.kts)
          EXE=$(find desktop/app/build/compose/binaries/main/exe -name '*.exe' | head -n 1)
          if [ -z "$EXE" ]; then echo "::error::No installer was produced."; exit 1; fi
          cp "$EXE" "SonderEye-$VERSION-Setup.exe"
          powershell -NoProfile -Command "Compress-Archive -Path 'desktop/app/build/compose/binaries/main/app/SonderEye' -DestinationPath 'SonderEye-$VERSION-Portable.zip'"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Starts the built app once on this Windows machine and photographs the screen: proof it
      # opens and draws, and any crash it logged.
      - name: Start it once (smoke test)
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          $app = "desktop/app/build/compose/binaries/main/app/SonderEye/SonderEye.exe"
          $p = Start-Process $app -PassThru
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")
          "running after 45 s: $(-not $p.HasExited)" | Out-File smoke.txt
          # Memory: after start-up, then after two minutes of zooming in and out and dragging.
          # The launcher starts Java as a separate process: measure every SonderEye/java process.
          function Mem { (Get-Process | Where-Object { $_.Name -match 'SonderEye|java' } | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB }
          "memory after start-up: $([math]::Round((Mem))) MB" | Out-File -Append smoke.txt
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Mouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, int dx, int dy, int data, UIntPtr e);
          }
          "@
          $cx = [int]($b.Width / 2); $cy = [int]($b.Height / 2)
          for ($r = 0; $r -lt 12; $r++) {
            [Mouse]::SetCursorPos($cx, $cy)
            for ($i = 0; $i -lt 8; $i++) { [Mouse]::mouse_event(0x0800, 0, 0, 120, [UIntPtr]::Zero); Start-Sleep -Milliseconds 150 }
            [Mouse]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
            for ($i = 0; $i -lt 10; $i++) { [Mouse]::SetCursorPos($cx - $i * 20, $cy - $i * 10); Start-Sleep -Milliseconds 50 }
            [Mouse]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
            for ($i = 0; $i -lt 8; $i++) { [Mouse]::mouse_event(0x0800, 0, 0, -120, [UIntPtr]::Zero); Start-Sleep -Milliseconds 150 }
            Start-Sleep -Seconds 4
          }
          "memory after two minutes of use: $([math]::Round((Mem))) MB" | Out-File -Append smoke.txt
          Get-Process | Sort-Object PrivateMemorySize64 -Descending | Select-Object -First 4 Name, @{n='MB';e={[math]::Round($_.PrivateMemorySize64 / 1MB)}} | Out-File -Append smoke.txt
          $log = Join-Path $env:LOCALAPPDATA "SonderEye/files/crash.log"
          if (Test-Path $log) { Get-Content $log | Out-File -Append smoke.txt } else { "no crash log" | Out-File -Append smoke.txt }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Publish (test build)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-test --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create windows-test "SonderEye-$VERSION-Setup.exe" "SonderEye-$VERSION-Portable.zip" screenshot.png smoke.txt \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "SonderEye for Windows, test build" \
            --notes "Test build from $GITHUB_REF_NAME at $GITHUB_SHA"

      - name: Publish (release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          # The Android release job creates the release; wait for it, then add the Windows files.
          TAG="${{ inputs.release || github.ref_name }}"
          for i in $(seq 1 60); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$TAG" "SonderEye-$VERSION-Setup.exe" "SonderEye-$VERSION-Portable.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The build output goes on the pre-release windows-ci-failure, where the API can read it.
          touch build.log
          gh release view windows-ci-failure --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create windows-ci-failure --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Last Windows CI failure" --notes "Replaced on every failed Windows build."
          (echo "$GITHUB_WORKFLOW on $GITHUB_REF_NAME at $GITHUB_SHA"; grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -n 400; echo ---; tail -n 150 build.log) > failure.txt
          gh release upload windows-ci-failure failure.txt --repo "$GITHUB_REPOSITORY" --clobber

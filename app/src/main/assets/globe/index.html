<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SonderEye globe</title>
<script>
  // Cesium loads its workers and sky assets from here. Pinned: a CDN "latest" would
  // change the engine under a build that was tested against another version.
  window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/';
  window.seFail = function (msg) {
    try { SonderEyeApp.error(String(msg)); } catch (e) { /* bridge missing: page opened outside the app */ }
  };
  window.addEventListener('error', function (e) {
    if (e && e.message) seFail('Globe script error: ' + e.message);
  });
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"
        onerror="seFail('Globe engine could not be downloaded (cdn.jsdelivr.net)')"></script>
<style>
  html, body, #globe { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03060A; }
  /* Imagery attribution is required by the provider; kept small and out of the way. */
  #credits { position: absolute; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
             font: 10px/1.3 sans-serif; color: #9AA7B4; opacity: .8; pointer-events: auto; }
  #credits a { color: #9AA7B4; }
  .cesium-credit-logoContainer img { height: 14px; }
</style>
</head>
<body>
<div id="globe"></div>
<div id="credits"></div>
<script>
(function () {
  if (typeof Cesium === 'undefined') return; // onerror above already reported it

  var bridge = window.SonderEyeApp || { ready: function () {}, select: function () {}, error: function () {} };
  var viewer;

  try {
    viewer = new Cesium.Viewer('globe', {
      baseLayer: new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        maximumLevel: 18,
        credit: 'Imagery: Esri, Maxar, Earthstar Geographics'
      })),
      animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
      homeButton: false, sceneModePicker: false, navigationHelpButton: false,
      fullscreenButton: false, infoBox: false, selectionIndicator: false,
      creditContainer: document.getElementById('credits'),
      // Draw only when something changes: an idle globe costs no battery.
      requestRenderMode: true,
      maximumRenderTimeChange: Infinity
    });
  } catch (e) {
    bridge.error('Globe could not start: ' + (e && e.message ? e.message : e) +
                 ' (WebGL unavailable or blocked by the WebView)');
    return;
  }

  // Render at the screen's real density, capped at 2x: sharp imagery without paying
  // for 3x pixels on phones that report it.
  viewer.useBrowserRecommendedResolution = false;
  viewer.resolutionScale = Math.min(2, window.devicePixelRatio || 1) / (window.devicePixelRatio || 1);

  var scene = viewer.scene;
  scene.globe.showGroundAtmosphere = true;
  scene.fog.enabled = true;
  scene.globe.maximumScreenSpaceError = 2;

  scene.globe.tileLoadProgressEvent.addEventListener(function () { scene.requestRender(); });
  scene.renderError.addEventListener(function (s, e) {
    bridge.error('Globe render error: ' + (e && e.message ? e.message : e));
  });

  var HOME = Cesium.Cartesian3.fromDegrees(0, 20, 20000000);
  viewer.camera.setView({ destination: HOME });

  // ---- Earthquakes ---------------------------------------------------------------

  var points = scene.primitives.add(new Cesium.PointPrimitiveCollection());
  var ring = scene.primitives.add(new Cesium.PointPrimitiveCollection());
  var byId = {};        // id -> { pos, lat, lon, size }
  var selectedId = null;

  // Depth drives colour (shallow quakes are the ones felt), magnitude drives size.
  function depthColor(km) {
    if (km < 70) return Cesium.Color.fromCssColorString('#FFB547');
    if (km < 300) return Cesium.Color.fromCssColorString('#FF5E57');
    return Cesium.Color.fromCssColorString('#B06CFF');
  }
  function sizeFor(mag) { return Math.max(4, Math.min(24, 4 + mag * 2.4)); }

  var OUTLINE = Cesium.Color.fromCssColorString('#03060A').withAlpha(0.85);

  function setQuakes(rows) {
    points.removeAll();
    byId = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i]; // [id, lat, lon, mag, depth]
      var pos = Cesium.Cartesian3.fromDegrees(r[2], r[1], 3000);
      var size = sizeFor(r[3]);
      points.add({ id: r[0], position: pos, pixelSize: size, color: depthColor(r[4]),
                   outlineColor: OUTLINE, outlineWidth: 1 });
      byId[r[0]] = { pos: pos, lat: r[1], lon: r[2], size: size };
    }
    if (selectedId && !byId[selectedId]) select(null, false);
    else drawRing();
    scene.requestRender();
  }

  function drawRing() {
    ring.removeAll();
    var q = selectedId && byId[selectedId];
    if (q) {
      ring.add({ position: q.pos, pixelSize: q.size + 14, color: Cesium.Color.TRANSPARENT,
                 outlineColor: Cesium.Color.WHITE, outlineWidth: 2.5 });
    }
    scene.requestRender();
  }

  function select(id, fly) {
    selectedId = id && byId[id] ? id : null;
    drawRing();
    if (selectedId && fly) {
      var q = byId[selectedId];
      var h = Math.min(viewer.camera.positionCartographic.height, 4000000);
      viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(q.lon, q.lat, Math.max(h, 600000)),
                            duration: 1.2 });
    }
  }

  // ---- Touch picking ----------------------------------------------------------------
  // A fingertip is far wider than a 6 px marker, so a tap picks the nearest visible
  // quake within reach instead of requiring an exact hit.

  var REACH_PX = 30;
  var toWindow = Cesium.SceneTransforms.worldToWindowCoordinates ||
                 Cesium.SceneTransforms.wgs84ToWindowCoordinates;

  function nearestAt(p) {
    var occluder = new Cesium.EllipsoidalOccluder(Cesium.Ellipsoid.WGS84, viewer.camera.positionWC);
    var best = null, bestD = REACH_PX * REACH_PX, w = new Cesium.Cartesian2();
    for (var id in byId) {
      var q = byId[id];
      if (!occluder.isPointVisible(q.pos)) continue;
      if (!toWindow(scene, q.pos, w)) continue;
      var dx = w.x - p.x, dy = w.y - p.y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = id; }
    }
    return best;
  }

  var handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
  handler.setInputAction(function (click) {
    var id = nearestAt(click.position);
    select(id, !!id);
    bridge.select(id || '');
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // ---- API for the app ----------------------------------------------------------------

  window.SE = {
    setQuakes: setQuakes,
    clearQuakes: function () { setQuakes([]); },
    select: function (id) { select(id || null, !!id); },
    home: function () { select(null, false); viewer.camera.flyTo({ destination: HOME, duration: 1.2 }); }
  };

  bridge.ready();
})();
</script>
</body>
</html>
